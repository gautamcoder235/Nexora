
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.16.0/lib/addon-webgl.js"></script>
</head>
<body style="background: black;">
    <div id="terminal" style="width: 800px; height: 600px;"></div>
    <script>
        window.startBenchmark = async () => {
            const term = new Terminal({ allowProposedApi: true });
            const webgl = new WebglAddon.WebglAddon();
            
            term.open(document.getElementById('terminal'));
            term.loadAddon(webgl);

            const measureThroughput = async (chunkSize, totalMB) => {
                return new Promise((resolve) => {
                    // Create chunk matching typical PTY output
                    const chunkStr = "A".repeat(chunkSize - 2) + "\r\n";
                    const totalBytes = totalMB * 1024 * 1024;
                    const numChunks = Math.ceil(totalBytes / chunkSize);
                    
                    let frames = 0;
                    let lastFrame = performance.now();
                    let droppedFrames = 0;
                    
                    const frameLoop = () => {
                        frames++;
                        const now = performance.now();
                        if (now - lastFrame > 32) droppedFrames++;
                        lastFrame = now;
                        if (frames < 10000) requestAnimationFrame(frameLoop);
                    };
                    requestAnimationFrame(frameLoop);

                    let chunksProcessed = 0;
                    const start = performance.now();
                    
                    // Simulate Event Loop Macro-tasks (Tauri IPC Bridge chunks)
                    const pump = () => {
                        // To simulate JS event loop strain, we yield using setTimeout 0
                        const batchEnd = Math.min(chunksProcessed + 10, numChunks); 
                        
                        let lastCallbackHit = false;
                        for (let i = chunksProcessed; i < batchEnd; i++) {
                            // Enqueue write with callback to measure actual render completion time
                            term.write(chunkStr, () => {
                                if (i === numChunks - 1) {
                                    const duration = performance.now() - start;
                                    resolve({
                                        chunkSize: chunkSize / 1024 + " KB",
                                        durationMs: Math.round(duration),
                                        mbPerSec: (totalMB / (duration / 1000)).toFixed(2),
                                        droppedFrames,
                                        eventsPerSec: Math.round(numChunks / (duration / 1000))
                                    });
                                }
                            });
                        }
                        
                        chunksProcessed = batchEnd;
                        if (chunksProcessed < numChunks) {
                            setTimeout(pump, 0); 
                        }
                    };
                    
                    pump();
                });
            };

            const results = [];
            
            // Warmup
            await measureThroughput(4096, 2); 
            term.clear();

            // Run benchmarks with 10MB payload to test Event Loop and WebGL latency
            const TOTAL_MB = 10;
            results.push(await measureThroughput(4096, TOTAL_MB));
            term.clear();
            results.push(await measureThroughput(16384, TOTAL_MB));
            term.clear();
            results.push(await measureThroughput(32768, TOTAL_MB));
            term.clear();
            results.push(await measureThroughput(65536, TOTAL_MB));
            term.clear();
            results.push(await measureThroughput(131072, TOTAL_MB));
            
            return results;
        };
    </script>
</body>
</html>
