<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      user-select: none;
      box-sizing: border-box;
    }

    .hover-container {
      background: rgba(18, 18, 22, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 
                  0 0 0 1px rgba(255, 255, 255, 0.02);
      padding: 8px;
      width: 180px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 8px; /* Room for shadows */
      opacity: 0;
      transform: translateY(4px) scale(0.96);
      transition: opacity 0.15s cubic-bezier(0.16, 1, 0.3, 1), transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hover-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .hover-title {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hover-thumbnail-container {
      width: 100%;
      aspect-ratio: 16/10;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hover-thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="hover-container" id="hover-container">
    <div class="hover-title" id="hover-title">Tab Preview</div>
    <div class="hover-thumbnail-container">
      <img id="hover-img" src="" alt="Preview" />
    </div>
  </div>

  <script>
    const container = document.getElementById('hover-container');
    const titleEl = document.getElementById('hover-title');
    const imgEl = document.getElementById('hover-img');

    window.electron.on('update-hover-preview', (data) => {
      titleEl.textContent = data.title || 'Tab Preview';
      imgEl.src = data.thumbnail || '';
      
      requestAnimationFrame(() => {
        container.classList.add('visible');
      });
    });

    window.electron.on('clear-hover-preview', () => {
      container.classList.remove('visible');
    });
  </script>
</body>
</html>
