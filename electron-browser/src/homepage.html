<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>

    :root {
      --bg-color: #030307;
      --text-color: #e2e2e9;
      --text-dim: #7d7d9c;
      --purple-accent: #a855f7;
      --fuchsia-accent: #ec4899;
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.05);
      --card-hover-border: rgba(168, 85, 247, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 5rem 2rem;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Layer 1: Mesh Glows */
    .glow-1, .glow-2, .glow-3 {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.12;
      mix-blend-mode: screen;
    }

    .glow-1 {
      top: -10%;
      left: 20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.8) 0%, transparent 70%);
      animation: floatBlob1 25s infinite ease-in-out alternate;
    }

    .glow-2 {
      bottom: 5%;
      right: 15%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.6) 0%, transparent 70%);
      animation: floatBlob2 20s infinite ease-in-out alternate;
    }

    .glow-3 {
      top: 30%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.5) 0%, transparent 70%);
      animation: floatBlob3 30s infinite ease-in-out alternate;
    }

    @keyframes floatBlob1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.1); }
      100% { transform: translate(-30px, 80px) scale(0.9); }
    }

    @keyframes floatBlob2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-50px, -60px) scale(0.9); }
      100% { transform: translate(40px, -20px) scale(1.15); }
    }

    @keyframes floatBlob3 {
      0% { transform: translate(0px, 0px) scale(1.1); }
      50% { transform: translate(80px, -30px) scale(0.85); }
      100% { transform: translate(-40px, -60px) scale(1.05); }
    }

    /* Layer 2: Noise Overlay */
    .noise {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      z-index: 1;
    }

    /* Layer 3: Dot Grid */
    .grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: center;
      mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1) 15%, rgba(0,0,0,0) 75%);
      -webkit-mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1) 15%, rgba(0,0,0,0) 75%);
      pointer-events: none;
      opacity: 0.85;
      z-index: 1;
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      text-align: center;
    }

    /* Clock */
    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .time {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -1.5px;
      background: linear-gradient(135deg, #ffffff 0%, #a2a2d0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(255,255,255,0.05);
    }

    .date {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Greeting & Quote Section */
    .greeting-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .greeting {
      font-size: 2.2rem;
      font-weight: 600;
      color: #e2e2e9;
      letter-spacing: -0.5px;
    }

    .greeting span.highlight {
      font-weight: 800;
      background: linear-gradient(90deg, #c77dff, #e0aaff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .quote-container {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-dim);
      max-width: 580px;
      line-height: 1.4;
      font-style: italic;
      opacity: 0.85;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    /* Search Omnibox Form */
    .search-container {
      width: 100%;
      position: relative;
    }

    .search-form {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, rgba(20, 20, 25, 0.7) 0%, rgba(10, 10, 15, 0.8) 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      height: 48px;
      padding: 0 6px 0 16px;
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-form:hover {
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .search-form:focus-within {
      border-color: var(--card-hover-border);
      box-shadow: 
        0 0 30px rgba(168, 85, 247, 0.15),
        0 15px 35px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .search-icon-wrapper {
      display: flex;
      align-items: center;
      color: var(--text-dim);
      margin-right: 12px;
    }

    .search-form:focus-within .search-icon-wrapper {
      color: var(--purple-accent);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-family: var(--font-family);
      font-size: 0.95rem;
      outline: none;
      width: 100%;
      user-select: text;
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    .search-btn {
      background: rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.2);
      color: #c77dff;
      font-family: var(--font-family);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0 16px;
      height: 36px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-btn:hover {
      background: rgba(168, 85, 247, 0.2);
      border-color: rgba(168, 85, 247, 0.4);
      color: #fff;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.25);
    }

    /* Shortcuts Grid */
    .shortcuts-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }

    .section-title {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    @media (max-width: 600px) {
      .shortcuts-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .shortcut-card {
      background: linear-gradient(135deg, rgba(20, 20, 25, 0.4) 0%, rgba(10, 10, 15, 0.6) 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: #c9c9e3;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.01);
    }

    .shortcut-card:hover {
      transform: translateY(-3px);
      background: rgba(168, 85, 247, 0.05);
      border-color: var(--card-hover-border);
      box-shadow: 
        0 15px 30px rgba(168, 85, 247, 0.08),
        0 5px 15px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      color: #fff;
    }

    .icon-container {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .shortcut-card:hover .icon-container {
      background: rgba(168, 85, 247, 0.12);
      border-color: rgba(168, 85, 247, 0.3);
      transform: scale(1.05);
    }

    .shortcut-card .icon-container svg {
      transition: all 0.3s;
    }

    .shortcut-card:hover .icon-container svg {
      color: #fff;
    }

    .shortcut-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .shortcut-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #e2e2e9;
      transition: color 0.2s;
    }

    .shortcut-card:hover .shortcut-title {
      color: #d8b4fe;
    }

    .shortcut-desc {
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .text-amber { color: #f59e0b; }
    .text-blue { color: #60a5fa; }
    .text-cyan { color: #22d3ee; }
    .text-zinc { color: #e4e4e7; }
    .text-emerald { color: #34d399; }

    /* Customize shortcuts styles */
    .shortcuts-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 8px;
    }

    .customize-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: var(--font-family);
      transition: all 0.2s;
    }

    .customize-btn:hover {
      background: rgba(168, 85, 247, 0.1);
      border-color: rgba(168, 85, 247, 0.3);
      color: #d8b4fe;
    }

    /* Modal styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: linear-gradient(135deg, rgba(15, 15, 20, 0.95) 0%, rgba(8, 8, 12, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      padding: 1.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(168, 85, 247, 0.1);
      transform: scale(0.9);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 8px;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
    }

    .modal-close:hover {
      color: #fff;
    }

    .shortcuts-list {
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .shortcuts-list::-webkit-scrollbar {
      width: 4px;
    }

    .shortcuts-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
    }

    .list-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .item-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
      text-align: left;
    }

    .item-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
    }

    .item-url {
      font-size: 0.65rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    .action-btn.delete-btn:hover {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }

    .add-new-btn {
      width: 100%;
      background: rgba(168, 85, 247, 0.08);
      border: 1px solid rgba(168, 85, 247, 0.2);
      color: #c77dff;
      border-radius: 12px;
      padding: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      margin-bottom: 1rem;
      font-family: var(--font-family);
    }

    .add-new-btn:hover {
      background: rgba(168, 85, 247, 0.16);
      border-color: rgba(168, 85, 247, 0.4);
      color: #fff;
    }

    /* Shortcut Form */
    .shortcut-form {
      display: none;
      flex-direction: column;
      gap: 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      text-align: left;
    }

    .shortcut-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-select {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-family: var(--font-family);
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--purple-accent);
    }

    .form-select option {
      background: #0f0f14;
      color: #fff;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-color);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-family);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-primary {
      background: var(--purple-accent);
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.25);
      font-family: var(--font-family);
    }

    .btn-primary:hover {
      background: #b87cf8;
      box-shadow: 0 4px 16px rgba(168, 85, 247, 0.4);
    }

    /* Scrollbar styling for homepage.html */
    html {
      color-scheme: dark;
    }
    
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-color);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      border: 2px solid var(--bg-color);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Recent Section */
    .recent-section {
      text-align: left;
      margin-top: 2rem;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.15s;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .recent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 0.5rem;
    }

    .recent-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.75rem;
    }

    .recent-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      color: inherit;
    }

    .recent-card:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(168, 85, 247, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .recent-card-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
      flex: 1;
    }

    .recent-favicon {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--purple-accent);
      flex-shrink: 0;
    }

    .recent-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .recent-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-url {
      font-size: 0.65rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-delete-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: all 0.2s;
      flex-shrink: 0;
      margin-left: 0.5rem;
    }

    .recent-card:hover .recent-delete-btn {
      opacity: 0.7;
    }

    .recent-delete-btn:hover {
      background: rgba(244, 63, 94, 0.15);
      color: #f43f5e;
      opacity: 1 !important;
    }
  </style>
</head>
<body>

  <div class="noise"></div>
  <div class="grid"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="glow-3"></div>

  <div class="container">
    <!-- Clock/Hero -->
    <div class="clock-container">
      <div class="time" id="clock">00:00:00</div>
      <div class="date" id="date">SUNDAY, JUNE 21</div>

    <!-- Greeting & Quote -->

      <div class="quote-container" id="quote-text"></div>

    <!-- Search Omnibox -->
    <div class="search-container">
      <form class="search-form" action="https://www.google.com/search" method="get" id="search-form">
        <div class="search-icon-wrapper">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

        <input type="text" name="q" class="search-input" placeholder="Search Google or enter web address..." autofocus autocomplete="off">
        <button type="submit" class="search-btn">Search</button>

    <!-- Developer Quick Links -->
    <div class="shortcuts-section">
      <div class="shortcuts-header">
        <div class="section-title">Developer Shortcuts</div>
        <button id="customize-btn" class="customize-btn" title="Customize Shortcuts">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Customize</span>
        </button>
      </div>
      <div class="shortcuts-grid" id="shortcuts-grid">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Recent Pages Section -->
    <div class="recent-section" id="recent-section" style="display: none;">
      <div class="recent-header">
        <div class="section-title">Recently Visited</div>
        <button id="clear-history-btn" class="btn-secondary" style="padding: 4px 10px; font-size: 0.7rem; border-radius: 6px;">Clear All</button>
      </div>
      <div class="recent-list" id="recent-list">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Customize Modal Overlay -->
  <div class="modal-overlay" id="customize-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Customize Shortcuts</div>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      
      <div class="shortcuts-list" id="modal-shortcuts-list">
        <!-- Populated dynamically -->
      </div>

      <button class="add-new-btn" id="add-shortcut-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Add Shortcut</span>
      </button>

      <!-- Add/Edit form -->
      <div class="shortcut-form" id="shortcut-form">
        <input type="hidden" id="form-edit-index" value="-1">
        <div class="form-group">
          <label class="form-label">Shortcut Name</label>
          <input type="text" id="form-name" class="form-input" placeholder="e.g. GitHub" required>
        </div>
        <div class="form-group">
          <label class="form-label">URL</label>
          <input type="text" id="form-url" class="form-input" placeholder="e.g. https://github.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <input type="text" id="form-desc" class="form-input" placeholder="e.g. Developer platform">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Icon Type</label>
            <select id="form-icon" class="form-select">
              <option value="terminal">Terminal / CLI</option>
              <option value="tauri">Stack / Server</option>
              <option value="react">Book / Docs</option>
              <option value="github">GitHub</option>
              <option value="globe">Globe / Web</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Accent Color</label>
            <select id="form-color" class="form-select">
              <option value="text-amber">Amber / Orange</option>
              <option value="text-blue">Blue</option>
              <option value="text-cyan">Cyan</option>
              <option value="text-emerald">Emerald / Green</option>
              <option value="text-zinc">Zinc / White</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" id="form-cancel-btn">Cancel</button>
          <button type="button" class="btn-primary" id="form-save-btn">Save Shortcut</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom Confirm Modal Overlay -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <div class="modal-title">Clear History</div>
        <button class="modal-close" id="confirm-close-btn">&times;</button>
      </div>
      <div class="modal-body" style="padding: 1rem 0; font-size: 0.85rem; color: var(--text-dim); line-height: 1.5; text-align: left;">
        Are you sure you want to clear your browsing history? This action cannot be undone.
      </div>
      <div class="form-actions" style="margin-top: 1rem;">
        <button type="button" class="btn-secondary" id="confirm-cancel-btn">Cancel</button>
        <button type="button" class="btn-primary" id="confirm-ok-btn" style="background: var(--fuchsia-accent); box-shadow: 0 4px 12px rgba(236, 72, 153, 0.25);">Clear History</button>
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
      
      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', options).toUpperCase();
      
      let greeting = "Welcome back";
      const hr = now.getHours();
      if (hr < 12) {
        greeting = "Good morning";
      } else if (hr < 17) {
        greeting = "Good afternoon";
      } else {
        greeting = "Good evening";
      }
      document.getElementById('greeting-text').innerHTML = `${greeting}, <span class="highlight">Explorer</span>`;
    }

    setInterval(updateClock, 1000);
    updateClock();

    const quotes = [
      '"Talk is cheap. Show me the code." — Linus Torvalds',
      '"Programs must be written for people to read, and only incidentally for machines to execute." — Harold Abelson',
      '"The best way to predict the future is to invent it." — Alan Kay',
      '"Simplicity is the soul of efficiency." — Austin Freeman',
      '"Make it work, make it right, make it fast." — Kent Beck',
      '"Before software can be reusable it first has to be usable." — Ralph Johnson',
      '"First, solve the problem. Then, write the code." — John Johnson',
      '"Design is not just what it looks like and feels like. Design is how it works." — Steve Jobs',
      '"The only way to do great work is to love what you do." — Steve Jobs',
      '"Computers are useless. They can only give you answers." — Pablo Picasso',
      '"Simplicity is the ultimate sophistication." — Leonardo da Vinci'
    ];

    function displayRandomQuote() {
      const randomIndex = Math.floor(Math.random() * quotes.length);
      document.getElementById('quote-text').textContent = quotes[randomIndex];
    }
    displayRandomQuote();

    // Spotlight cursor tracking for Search Omnibox Form
    const searchForm = document.getElementById('search-form');
    searchForm.addEventListener('mousemove', (e) => {
      const rect = searchForm.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      searchForm.style.setProperty('--mouse-x', `${x}px`);
      searchForm.style.setProperty('--mouse-y', `${y}px`);
    });

    searchForm.addEventListener('mouseleave', () => {
      searchForm.style.setProperty('--mouse-x', '50%');
      searchForm.style.setProperty('--mouse-y', '50%');
    });

    // Form navigation helper
    searchForm.addEventListener('submit', (e) => {
      const input = searchForm.querySelector('.search-input');
      const val = input.value.trim();
      if (!val) {
        e.preventDefault();
        return;
      }
      
      const hasScheme = /^[a-zA-Z0-9+-.]+:\/\//.test(val);
      if (hasScheme || (val.includes('.') && !val.includes(' '))) {
        // Direct navigation
        e.preventDefault();
        window.location.href = hasScheme ? val : 'https://' + val;
      }
    });

    // ==========================================================================
    // CUSTOMIZABLE DEVELOPER SHORTCUTS
    // ==========================================================================

    // Icons SVG mapping
    const iconsMap = {
      terminal: (colorClass) => `
        <svg class="${colorClass}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
      `,
      tauri: (colorClass) => `
        <svg class="${colorClass}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
          <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
          <line x1="6" y1="6" x2="6.01" y2="6"></line>
          <line x1="6" y1="18" x2="6.01" y2="18"></line>
        </svg>
      `,
      react: (colorClass) => `
        <svg class="${colorClass}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
      `,
      github: (colorClass) => `
        <svg class="${colorClass}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
          <path d="M9 18c-4.51 2-5-2-7-2" />
        </svg>
      `,
      globe: (colorClass) => `
        <svg class="${colorClass}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      `
    };

    const defaultShortcuts = [
      { name: "localhost:5173", url: "http://localhost:5173", desc: "Vite dev server", icon: "terminal", colorClass: "text-amber" },
      { name: "localhost:3000", url: "http://localhost:3000", desc: "Node dev server", icon: "terminal", colorClass: "text-amber" },
      { name: "Tauri Docs", url: "https://tauri.app", desc: "App framework reference", icon: "tauri", colorClass: "text-blue" },
      { name: "React Docs", url: "https://react.dev", desc: "Library documentation", icon: "react", colorClass: "text-cyan" },
      { name: "GitHub", url: "https://github.com", desc: "Developer platform", icon: "github", colorClass: "text-zinc" },
      { name: "Google", url: "https://google.com", desc: "Web search engine", icon: "globe", colorClass: "text-emerald" }
    ];

    let shortcuts = [];

    // Load shortcuts
    function loadShortcuts() {
      const stored = localStorage.getItem('nexora_shortcuts');
      if (stored) {
        try {
          shortcuts = JSON.parse(stored);
        } catch (e) {
          shortcuts = [...defaultShortcuts];
        }
      } else {
        shortcuts = [...defaultShortcuts];
        localStorage.setItem('nexora_shortcuts', JSON.stringify(shortcuts));
      }
    }

    // Save shortcuts
    function saveShortcuts() {
      localStorage.setItem('nexora_shortcuts', JSON.stringify(shortcuts));
      renderShortcuts();
    }

    // Render shortcuts in grid
    function renderShortcuts() {
      const grid = document.getElementById('shortcuts-grid');
      grid.innerHTML = '';
      
      shortcuts.forEach((item, index) => {
        const card = document.createElement('a');
        card.href = item.url;
        card.className = 'shortcut-card';
        
        const iconHtml = iconsMap[item.icon] ? iconsMap[item.icon](item.colorClass) : iconsMap.globe(item.colorClass);
        
        card.innerHTML = `
          <div class="icon-container">
            ${iconHtml}
          </div>
          <div class="shortcut-info">
            <span class="shortcut-title">${item.name}</span>
            <span class="shortcut-desc">${item.desc || item.url}</span>
          </div>
        `;
        
        // Add spotlight and tilt listeners to card
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          card.style.setProperty('--mouse-x', `${x}px`);
          card.style.setProperty('--mouse-y', `${y}px`);

          // 3D Tilt
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const rotateX = ((y - centerY) / centerY) * -6;
          const rotateY = ((x - centerX) / centerX) * 6;
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-3px) scale(1.01)`;
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = "";
          card.style.setProperty('--mouse-x', '50%');
          card.style.setProperty('--mouse-y', '50%');
        });

        grid.appendChild(card);
      });
    }

    // Render shortcuts list in modal
    function renderModalList() {
      const listContainer = document.getElementById('modal-shortcuts-list');
      listContainer.innerHTML = '';
      
      shortcuts.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        
        const iconHtml = iconsMap[item.icon] ? iconsMap[item.icon](item.colorClass) : iconsMap.globe(item.colorClass);
        
        div.innerHTML = `
          <div class="item-left">
            <div class="icon-container" style="width: 28px; height: 28px; border-radius: 8px;">
              ${iconHtml}
            </div>
            <div class="item-meta">
              <span class="item-name">${item.name}</span>
              <span class="item-url">${item.url}</span>
            </div>
          </div>
          <div class="item-actions">
            <button class="action-btn edit-btn" data-index="${index}" title="Edit Shortcut">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"></path>
              </svg>
            </button>
            <button class="action-btn delete-btn" data-index="${index}" title="Delete Shortcut">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </div>
        `;
        
        listContainer.appendChild(div);
      });

      // Hook events
      listContainer.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.index);
          openForm(idx);
        });
      });

      listContainer.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.index);
          shortcuts.splice(idx, 1);
          saveShortcuts();
          renderModalList();
        });
      });
    }

    // Form logic
    const modal = document.getElementById('customize-modal');
    const form = document.getElementById('shortcut-form');
    
    function openForm(index = -1) {
      form.classList.add('active');
      document.getElementById('form-edit-index').value = index;
      
      if (index >= 0) {
        const item = shortcuts[index];
        document.getElementById('form-name').value = item.name;
        document.getElementById('form-url').value = item.url;
        document.getElementById('form-desc').value = item.desc || '';
        document.getElementById('form-icon').value = item.icon;
        document.getElementById('form-color').value = item.colorClass;
        document.getElementById('form-save-btn').textContent = 'Update Shortcut';
      } else {
        document.getElementById('form-name').value = '';
        document.getElementById('form-url').value = '';
        document.getElementById('form-desc').value = '';
        document.getElementById('form-icon').value = 'terminal';
        document.getElementById('form-color').value = 'text-amber';
        document.getElementById('form-save-btn').textContent = 'Save Shortcut';
      }
    }

    function closeForm() {
      form.classList.remove('active');
    }

    // Event hooks
    document.getElementById('customize-btn').addEventListener('click', () => {
      loadShortcuts();
      renderModalList();
      modal.classList.add('active');
      closeForm();
    });

    document.getElementById('modal-close-btn').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    document.getElementById('add-shortcut-btn').addEventListener('click', () => {
      openForm(-1);
    });

    document.getElementById('form-cancel-btn').addEventListener('click', closeForm);

    document.getElementById('form-save-btn').addEventListener('click', () => {
      const name = document.getElementById('form-name').value.trim();
      let url = document.getElementById('form-url').value.trim();
      const desc = document.getElementById('form-desc').value.trim();
      const icon = document.getElementById('form-icon').value;
      const colorClass = document.getElementById('form-color').value;
      const editIndex = parseInt(document.getElementById('form-edit-index').value);

      if (!name || !url) {
        alert('Name and URL are required.');
        return;
      }

      // Add schema if missing
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }

      const item = { name, url, desc, icon, colorClass };

      if (editIndex >= 0) {
        shortcuts[editIndex] = item;
      } else {
        shortcuts.push(item);
      }

      saveShortcuts();
      renderModalList();
      closeForm();
    });

    // Close modal when clicking outside
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
      }
    });

    // Initial load
    loadShortcuts();
    renderShortcuts();

    // History / Recent Pages logic
    const recentSection = document.getElementById('recent-section');
    const recentList = document.getElementById('recent-list');
    const clearHistoryBtn = document.getElementById('clear-history-btn');

    function renderHistory(historyList) {
      recentList.innerHTML = '';
      if (!historyList || historyList.length === 0) {
        recentSection.style.display = 'none';
        return;
      }
      recentSection.style.display = 'block';

      historyList.forEach(item => {
        const card = document.createElement('a');
        card.className = 'recent-card';
        card.href = '#';
        card.title = item.title;

        // Extract hostname for display and dynamic fallback favicon
        let hostname = '';
        try {
          hostname = new URL(item.url).hostname;
        } catch (e) {
          hostname = item.url;
        }

        const initial = hostname.replace('www.', '').substring(0, 1).toUpperCase() || '?';

        card.innerHTML = `
          <div class="recent-card-left">
            <div class="recent-favicon">${initial}</div>
            <div class="recent-info">
              <span class="recent-title">${item.title}</span>
              <span class="recent-url">${hostname}</span>
            </div>
          </div>
          <button class="recent-delete-btn" title="Remove from history">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.closest('.recent-delete-btn')) {
            e.stopPropagation();
            e.preventDefault();
            if (window.electron) {
              window.electron.send('delete-history-item', item.url);
            }
            return;
          }
          e.preventDefault();
          if (window.electron) {
            window.electron.send('browser-navigate', item.url);
          }
        });

        recentList.appendChild(card);
      });
    }

    if (window.electron) {
      window.electron.on('history-data', (data) => {
        renderHistory(data);
      });
      window.electron.on('history-updated', (data) => {
        renderHistory(data);
      });

      // Request history
      window.electron.send('get-history');
    }

    const confirmModal = document.getElementById('confirm-modal');
    const confirmOkBtn = document.getElementById('confirm-ok-btn');
    const confirmCancelBtn = document.getElementById('confirm-cancel-btn');
    const confirmCloseBtn = document.getElementById('confirm-close-btn');

    clearHistoryBtn.addEventListener('click', () => {
      if (window.electron) {
        confirmModal.classList.add('active');
      }
    });

    const closeConfirmModal = () => {
      confirmModal.classList.remove('active');
    };

    confirmCancelBtn.addEventListener('click', closeConfirmModal);
    confirmCloseBtn.addEventListener('click', closeConfirmModal);

    confirmOkBtn.addEventListener('click', () => {
      if (window.electron) {
        window.electron.send('clear-history');
      }
      closeConfirmModal();
    });

    // Close confirm modal when clicking outside
    confirmModal.addEventListener('click', (e) => {
      if (e.target === confirmModal) {
        closeConfirmModal();
      }
    });
  </script>
</body>
</html>
