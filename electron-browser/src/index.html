<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora Browser</title>
    <style>
      html, body {
        background-color: #0c0c0e !important;
      }
    </style>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>

  <body>
    <header class="browser-header">
      <!-- Tabs Bar -->
      <div class="tabs-container">
        <div class="tabs-list" id="tabs-list">
          <!-- Tabs dynamically populated here -->
        </div>
        <button id="new-tab-btn" class="new-tab-btn" title="New Tab">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>

      <!-- Navigation Controls & Address bar -->
      <div class="browser-navbar">
      <div class="nav-controls">
        <button id="back-btn" class="nav-btn" title="Go back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        
        <button id="forward-btn" class="nav-btn" title="Go forward">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
        
        <button id="reload-btn" class="nav-btn" title="Reload page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
          </svg>
        </button>
        
        <button id="home-btn" class="nav-btn" title="Go to Home">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </button>
      </div>

      <div class="address-bar-container">
        <div class="address-input-wrapper">
          <div class="search-indicator" id="search-indicator">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <button id="site-settings-btn" class="site-settings-btn" title="Site Settings" style="display: none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="9" r="3"></circle>
              <line x1="13" y1="9" x2="20" y2="9"></line>
              <line x1="4" y1="15" x2="11" y2="15"></line>
              <circle cx="16" cy="15" r="3"></circle>
            </svg>
          </button>
          <input type="text" id="address-input" placeholder="Search Google or type a URL..." autocomplete="off" spellcheck="false" />
          <button id="go-btn" class="go-btn" title="Navigate">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>

      </div>

      <div class="navbar-actions">
        <!-- Device Emulation Viewport -->
        <div class="emulation-container">
          <button id="emulation-btn" class="emulation-btn" title="Device Emulation">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2" stroke-dasharray="3 3"></rect>
              <rect x="6" y="6" width="12" height="8" rx="1" ry="1"></rect>
            </svg>
            <span class="active-mode-dot"></span>
          </button>
          <div id="emulation-menu" class="emulation-menu">
            <button class="emulation-menu-item active" data-value="responsive" title="Responsive (Auto)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2" stroke-dasharray="3 3"></rect>
                <rect x="6" y="6" width="12" height="8" rx="1" ry="1"></rect>
              </svg>
            </button>
            <button class="emulation-menu-item" data-value="mobile" title="Mobile (375 × 720)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="2" width="12" height="20" rx="2" ry="2"></rect>
                <line x1="12" y1="18" x2="12.01" y2="18"></line>
              </svg>
            </button>
            <button class="emulation-menu-item" data-value="tablet" title="Tablet (768 × 960)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
                <line x1="12" y1="18" x2="12.01" y2="18"></line>
              </svg>
            </button>
            <button class="emulation-menu-item" data-value="desktop" title="Desktop (1440 × 900)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
            </button>
          </div>
        </div>

        <button id="inspect-btn" class="inspect-btn" title="Inspect Element">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="6"></circle>
            <circle cx="12" cy="12" r="2"></circle>
          </svg>
          <span>Inspect Element</span>
        </button>
      </div>
    </div>
    </header>

    <!-- Content area: child webview will cover this -->
    <main class="content-viewport-placeholder">
      <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
      </div>
    </main>
    <!-- Element Picker Sidebar -->
    <aside id="element-picker-sidebar" class="picker-sidebar hidden">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <svg class="sidebar-title-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="6"></circle>
            <circle cx="12" cy="12" r="2"></circle>
          </svg>
          <span>Element Picker</span>
        </div>
        <button id="close-picker-btn" class="close-btn" title="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="sidebar-content">
        <!-- Pick Mode Switch -->
        <div class="picker-toggle-container">
          <div class="toggle-info">
            <span class="toggle-title">Pick mode</span>
            <span class="toggle-desc">Click an element to capture it</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="pick-mode-checkbox">
            <span class="slider round"></span>
          </label>
        </div>

        <!-- Selector Display -->
        <div class="detail-section">
          <div class="section-title">Selector</div>
          <div class="selector-display-box" id="picked-selector">None</div>
        </div>

        <!-- CSS Selector Tester -->
        <div class="detail-section">
          <div class="section-title">CSS Selector Tester</div>
          <div class="tester-input-container">
            <input type="text" id="selector-tester-input" class="tester-input" placeholder="Type a CSS selector (e.g. .btn, a)...">
            <div id="selector-tester-results" class="tester-results-badge hidden">0 matches</div>
          </div>
          <div id="tester-matches-list" class="tester-matches-list hidden"></div>
        </div>

        <!-- Element Details -->
        <div class="detail-section">
          <div class="section-title">Element Details</div>
          <table class="details-table">
            <tr>
              <td class="label-col">Tag</td>
              <td class="value-col highlight-value" id="picked-tag">-</td>
            </tr>
            <tr>
              <td class="label-col">ID</td>
              <td class="value-col" id="picked-id">-</td>
            </tr>
            <tr>
              <td class="label-col">Classes</td>
              <td class="value-col" id="picked-classes">-</td>
            </tr>
            <tr>
              <td class="label-col">Text</td>
              <td class="value-col" id="picked-text">-</td>
            </tr>
          </table>
        </div>

        <!-- Computed Styles -->
        <div class="detail-section">
          <div class="section-title collapsible" id="computed-styles-trigger">
            <span>Computed Styles</span>
            <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div class="styles-content collapsed" id="computed-styles-content">
            <table class="details-table" id="styles-table">
              <!-- Dynamically populated -->
            </table>
          </div>
        </div>

        <!-- Accessibility -->
        <div class="detail-section">
          <div class="section-title">Accessibility</div>
          <table class="details-table">
            <tr>
              <td class="label-col">Role</td>
              <td class="value-col" id="accessibility-role">-</td>
            </tr>
            <tr>
              <td class="label-col">Label</td>
              <td class="value-col" id="accessibility-label">-</td>
            </tr>
            <tr>
              <td class="label-col">Focusable</td>
              <td class="value-col" id="accessibility-focusable">-</td>
            </tr>
          </table>
        </div>

        <!-- Actions -->
        <div class="detail-section">
          <div class="section-title">Actions</div>
          <div class="action-buttons-list">
            <button class="action-btn" id="action-copy-selector">
              <span>» Copy Selector</span>
              <svg class="action-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <button class="action-btn" id="action-copy-outer-html">
              <span>» Copy Outer HTML</span>
              <svg class="action-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <button class="action-btn" id="action-copy-inner-html">
              <span>» Copy Inner HTML</span>
              <svg class="action-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <button class="action-btn" id="action-copy-styles">
              <span>» Copy Styles</span>
              <svg class="action-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <button class="action-btn" id="action-copy-screenshot">
              <span>» Copy Element Screenshot</span>
              <svg class="action-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
            </button>
            <button class="action-btn" id="action-open-devtools">
              <span>» Open in DevTools</span>
              <svg class="action-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Toast Notification -->
      <div id="toast-notification" class="toast-notification">
        <svg class="toast-check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="toast-message">Copied to clipboard!</span>
      </div>

      <!-- Custom Alert Modal Overlay -->
      <div class="modal-overlay" id="alert-modal">
        <div class="modal-content">
          <div class="modal-header">
            <div class="modal-title" id="alert-title">Notification</div>
            <button class="modal-close" id="alert-close-btn">&times;</button>
          </div>
          <div class="modal-body" id="alert-body">
            Message
          </div>
          <div class="form-actions">
            <button type="button" class="btn-primary" id="alert-ok-btn">OK</button>
          </div>
        </div>
      </div>
    </aside>



    <!-- Local Port Detector Notification -->
    <div id="port-detector-notification" class="port-notification">
      <div class="port-notification-content">
        <svg class="port-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
          <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
          <line x1="6" y1="6" x2="6.01" y2="6"></line>
          <line x1="6" y1="18" x2="6.01" y2="18"></line>
        </svg>
        <span>Local server detected on port <span id="detected-port-num" style="color: #c084fc; font-weight: bold;">5173</span></span>
      </div>
      <button id="open-detected-port-btn" class="port-open-btn">Open Tab</button>
      <button id="close-port-notification" class="port-close-btn">&times;</button>
    </div>
  </body>
</html>
