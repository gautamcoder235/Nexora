[package]
name = "nexora-core"
version = "0.1.0"
edition = "2021"
description = "Shared core library for Nexora Desktop application and CLI binary"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
redb = "2.1"
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
owo-colors = "4.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
async-stream = "0.3.6"
tokio-stream = "0.1.18"
tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.32"
